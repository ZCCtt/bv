name: Sync Fork

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点同步（北京时间 8 点）
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 必须保留（推送代码变更）
      pull-requests: write  # 必须保留（创建PR）
      workflows: write       # 新增！允许修改/推送 workflow 文件
      # 移除 actions: write（非必需，且不覆盖 workflows 权限）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 拉取所有历史，避免合并冲突

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 避免重复添加 upstream 远程
          if ! git remote | grep -q "upstream"; then
            git remote add upstream https://github.com/aaa1115910/bv.git
          fi
          git fetch upstream  # 拉取上游所有分支

      - name: Install GitHub CLI (if missing)
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Sync with upstream develop
        run: |
          # 确保当前分支是 develop
          git checkout develop
          git pull origin develop  # 先拉取本地仓库最新变更
          
          # 尝试合并上游 develop 分支
          if git merge upstream/develop --no-edit; then
            echo "✅ 合并上游变更成功，推送至本地仓库"
            git push origin develop
          else
            echo "⚠️  检测到合并冲突，创建同步PR"
            # 标记冲突文件为已解决（需手动后续处理冲突内容）
            git add .
            git commit -am "自动同步上游分支 - 标记冲突已解决 $(date +'%Y-%m-%d %H:%M:%S')"
            # 创建临时分支用于PR
            sync_branch="sync-upstream-$(date +%Y%m%d%H%M%S)"
            git checkout -b $sync_branch
            git push origin $sync_branch
            # 使用 gh 工具创建PR
            gh pr create \
              --title "🔄 上游同步: $(date +'%Y-%m-%d')" \
              --body "自动同步上游仓库（https://github.com/aaa1115910/bv.git）develop 分支\n⚠️  存在合并冲突，需手动审查后合并" \
              --base develop \
              --head $sync_branch \
              --label "sync-upstream"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Sync Fork (稳定版·跳过 Workflows)

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点同步（北京时间 8 点）
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 仅需核心代码推送权限
      pull-requests: write  # 冲突时创建PR权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 拉取所有历史

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加上游远程（避免重复）
          if ! git remote | grep -q "upstream"; then
            git remote add upstream https://github.com/aaa1115910/bv.git
          fi
          git fetch upstream

      - name: Install GitHub CLI (if missing)
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Sync with upstream (彻底跳过 Workflows)
        run: |
          git checkout develop
          git pull origin develop  # 拉取本地最新变更

          # 修复合并语法：用 git checkout 单独合并非 workflow 文件（更稳定）
          # 逻辑：先检出上游所有文件，再恢复本地 workflow 目录（覆盖上游变更）
          git checkout upstream/develop -- .  # 合并上游所有文件到本地
          git checkout HEAD -- .github/workflows/  # 恢复本地 workflow 目录（不覆盖）
          
          # 检查是否有变更需要推送
          if git diff --quiet origin/develop; then
            echo "✅ 本地分支已与上游同步，无变更需要推送"
            exit 0
          fi

          # 提交变更并推送
          git add .
          git commit -am "🔄 同步上游 develop 分支（跳过 Workflows）$(date +'%Y-%m-%d %H:%M:%S')"
          
          # 推送前再次确认：移除 workflow 目录的变更（双重保障）
          git reset HEAD -- .github/workflows/
          git checkout -- .github/workflows/
          
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理合并冲突（仅当推送失败时触发）
        if: failure()
        run: |
          echo "⚠️  推送失败，检测到冲突，创建同步PR"
          sync_branch="sync-upstream-$(date +%Y%m%d%H%M%S)"
          git checkout -b $sync_branch
          
          # 仅添加非 workflow 目录的变更
          git add . -- ':!.github/workflows/'
          if ! git diff --cached --quiet; then
            git commit -am "🔄 同步上游分支（跳过 Workflows）$(date +'%Y-%m-%d')"
          fi
          
          git push origin $sync_branch
          # 移除标签参数（避免标签不存在报错）
          gh pr create \
            --title "🔄 上游同步: $(date +'%Y-%m-%d')（跳过 Workflows）" \
            --body "自动同步上游 develop 分支，已忽略 .github/workflows/ 目录变更\n上游仓库：https://github.com/aaa1115910/bv.git" \
            --base develop \
            --head $sync_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

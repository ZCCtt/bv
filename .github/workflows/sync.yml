name: Sync Fork (Skip Workflows)

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点同步（北京时间 8 点）
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 仅需核心代码推送权限
      pull-requests: write  # 冲突时创建PR权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 拉取所有历史

      - name: Configure Git (忽略 workflow 文件)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加上游远程（避免重复）
          if ! git remote | grep -q "upstream"; then
            git remote add upstream https://github.com/aaa1115910/bv.git
          fi
          git fetch upstream

          # 关键：标记 workflow 目录为"不跟踪变更"，彻底跳过合并
          mkdir -p .github/workflows/
          git update-index --assume-unchanged .github/workflows/** || true

      - name: Install GitHub CLI (if missing)
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Sync with upstream (跳过 workflows)
        run: |
          git checkout develop
          git pull origin develop  # 拉取本地最新变更

          # 修复合并命令：移除无效的目录参数，仅合并上游分支
          if git merge upstream/develop --no-edit; then
            echo "✅ 合并成功（已跳过 workflow 文件），推送变更"
            git push origin develop
          else
            echo "⚠️  检测到冲突（非 workflow 文件），创建PR"
            sync_branch="sync-upstream-$(date +%Y%m%d%H%M%S)"
            git checkout -b $sync_branch
            
            # 仅添加非 workflow 目录的冲突文件，避免空提交
            git add . -- ':!.github/workflows/'
            # 若有变更则提交，无变更则跳过（避免空提交报错）
            if git diff --cached --quiet; then
              echo "无需要提交的变更，直接推送分支"
            else
              git commit -am "自动同步上游分支（跳过 workflows）$(date +'%Y-%m-%d')"
            fi
            
            git push origin $sync_branch
            gh pr create \
              --title "🔄 上游同步: $(date +'%Y-%m-%d')（跳过 workflows）" \
              --body "自动同步上游 develop 分支，已忽略 .github/workflows/ 目录变更" \
              --base develop \
              --head $sync_branch \
              --label "sync-upstream"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
